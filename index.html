
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FRONTLINE FPS</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#111;color:white;font-family:Arial}
canvas{display:block;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}
.top{display:flex;justify-content:space-between;padding:15px}
.box{background:#101a20dd;padding:10px 16px;border:1px solid #607c8a;border-radius:9px}
#cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:25px;color:white}
#bottom{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:15px}
.controls{display:flex;gap:9px;pointer-events:auto}
button{background:#263c49;color:white;border:1px solid #8ca9b8;border-radius:12px;padding:15px;font-weight:bold}
#fire{background:#a42d25;padding:22px}
#stick{width:110px;height:110px;border-radius:50%;border:2px solid #ffffff88;background:#ffffff18;pointer-events:auto;position:relative;touch-action:none}
#knob{position:absolute;width:43px;height:43px;border-radius:50%;background:#c6d7df;left:32px;top:32px}
#start{position:fixed;inset:0;background:#111e29;display:grid;place-items:center;z-index:10}
.card{text-align:center;padding:25px;background:#172b39;border-radius:20px;max-width:340px;width:90%}
#play{background:#267c9d;width:100%;padding:16px}
</style>
</head>
<body>
<div id="start">
 <div class="card">
  <h1>FRONTLINE FPS</h1>
  <p>3D First Person Shooter</p>
  <p>Mode latihan • Target shooting</p>
  <button id="play">MULAI GAME</button>
 </div>
</div>
<div id="hud">
 <div class="top">
  <div class="box">HP: <b id="hp">100</b></div>
  <div class="box">SKOR: <b id="score">0</b></div>
  <div class="box">PELURU: <b id="ammo">30</b></div>
 </div>
 <div id="cross">+</div>
 <div id="bottom">
  <div id="stick"><div id="knob"></div></div>
  <div class="controls">
   <button id="jump">JUMP</button>
   <button id="reload">RELOAD</button>
   <button id="fire">TEMBAK</button>
  </div>
 </div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bb2c1);
scene.fog=new THREE.Fog(0x9bb2c1,20,90);

const camera=new THREE.PerspectiveCamera(
75,innerWidth/innerHeight,.1,1000
);
camera.position.set(0,1.7,5);

const renderer=new THREE.WebGLRenderer({
 antialias:true,
 powerPreference:'high-performance'
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x56616a,2));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(10,20,10);
sun.castShadow=true;
scene.add(sun);

// Lantai arena
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(100,100),
 new THREE.MeshStandardMaterial({color:0x52665b})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// Bangunan arena
function building(x,z,w,h,d,color=0x69747b){
 const obj=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color})
 );
 obj.position.set(x,h/2,z);
 obj.castShadow=true;
 obj.receiveShadow=true;
 scene.add(obj);
}
building(-9, -9,5,5,5);
building(9,-12,6,4,5);
building(-12,8,5,6,5);
building(12,9,5,5,6);
building(0,-22,18,5,3);

// Senjata sederhana FPP
const gun=new THREE.Group();
const metal=new THREE.MeshStandardMaterial({
 color:0x27343d,metalness:.7,roughness:.3
});
const body=new THREE.Mesh(
 new THREE.BoxGeometry(.18,.17,.75),metal
);
body.position.set(.35,-.28,-.65);
gun.add(body);
const barrel=new THREE.Mesh(
 new THREE.CylinderGeometry(.035,.035,.65,12),metal
);
barrel.rotation.x=Math.PI/2;
barrel.position.set(.35,-.23,-1.12);
gun.add(barrel);
const grip=new THREE.Mesh(
 new THREE.BoxGeometry(.12,.3,.17),metal
);
grip.position.set(.35,-.47,-.48);
gun.add(grip);
camera.add(gun);
scene.add(camera);

// Target latihan
const targets=[];
const targetMaterial=new THREE.MeshStandardMaterial({
 color:0xb54d39
});
function spawnTargets(){
 targets.forEach(t=>scene.remove(t));
 targets.length=0;
 for(let i=0;i<8;i++){
  const t=new THREE.Mesh(
   new THREE.SphereGeometry(.55,16,12),
   targetMaterial.clone()
  );
  t.position.set(
   (Math.random()-.5)*18,
   1.6+Math.random()*2,
   -8-Math.random()*25
  );
  t.castShadow=true;
  t.userData.alive=true;
  scene.add(t);
  targets.push(t);
 }
}
spawnTargets();

let score=0,ammo=30,recoil=0;
let pitch=0,yaw=0;
let moveX=0,moveY=0;
let jumping=false,vertical=0;
let reloading=false;

const raycaster=new THREE.Raycaster();

function shoot(){
 if(reloading||ammo<=0)return;
 ammo--;
 recoil=Math.min(recoil+.055,.35);
 document.getElementById('ammo').textContent=ammo;

 camera.rotation.x-=.018;
 raycaster.setFromCamera(new THREE.Vector2(0,0),camera);
 const hits=raycaster.intersectObjects(targets);
 if(hits.length){
  const t=hits[0].object;
  if(t.userData.alive){
   t.userData.alive=false;
   scene.remove(t);
   score+=100;
   document.getElementById('score').textContent=score;
  }
 }
}

document.getElementById('fire').onclick=shoot;

document.getElementById('reload').onclick=()=>{
 if(reloading||ammo===30)return;
 reloading=true;
 setTimeout(()=>{
  ammo=30;
  reloading=false;
  document.getElementById('ammo').textContent=ammo;
 },1200);
};

document.getElementById('jump').onclick=()=>{
 if(!jumping){
  jumping=true;
  vertical=5;
 }
};

// Joystick
const stick=document.getElementById('stick');
const knob=document.getElementById('knob');
let stickId=null;
stick.addEventListener('pointerdown',e=>{
 stickId=e.pointerId;
 stick.setPointerCapture(stickId);
});
stick.addEventListener('pointermove',e=>{
 if(e.pointerId!==stickId)return;
 const r=stick.getBoundingClientRect();
 const dx=e.clientX-(r.left+r.width/2);
 const dy=e.clientY-(r.top+r.height/2);
 const len=Math.hypot(dx,dy);
 const scale=Math.min(1,40/(len||1));
 moveX=dx/40*scale;
 moveY=dy/40*scale;
 knob.style.transform=`translate(${moveX*32}px,${moveY*32}px)`;
});
function resetStick(){
 stickId=null;moveX=0;moveY=0;
 knob.style.transform='translate(0,0)';
}
stick.addEventListener('pointerup',resetStick);
stick.addEventListener('pointercancel',resetStick);

// Geser sisi kanan untuk melihat
let lookId=null,lastX=0,lastY=0;
renderer.domElement.addEventListener('pointerdown',e=>{
 if(e.clientX>innerWidth*.38){
  lookId=e.pointerId;
  lastX=e.clientX;lastY=e.clientY;
  renderer.domElement.setPointerCapture(lookId);
 }
});
renderer.domElement.addEventListener('pointermove',e=>{
 if(e.pointerId!==lookId)return;
 const dx=e.clientX-lastX;
 const dy=e.clientY-lastY;
 lastX=e.clientX;lastY=e.clientY;
 yaw-=dx*.004;
 pitch-=dy*.004;
 pitch=Math.max(-1.2,Math.min(1.2,pitch));
 camera.rotation.order='YXZ';
 camera.rotation.y=yaw;
 camera.rotation.x=pitch;
});
renderer.domElement.addEventListener('pointerup',()=>lookId=null);
renderer.domElement.addEventListener('pointercancel',()=>lookId=null);

document.getElementById('play').onclick=()=>{
 document.getElementById('start').style.display='none';
 animate();
};

let previous=performance.now();
function animate(now=performance.now()){
 requestAnimationFrame(animate);
 const dt=Math.min((now-previous)/1000,.05);
 previous=now;

 const forward=new THREE.Vector3(
  -Math.sin(yaw),0,-Math.cos(yaw)
 );
 const right=new THREE.Vector3(
  Math.cos(yaw),0,-Math.sin(yaw)
 );

 camera.position.addScaledVector(forward,-moveY*5*dt);
 camera.position.addScaledVector(right,moveX*5*dt);

 if(jumping){
  camera.position.y+=vertical*dt;
  vertical-=12*dt;
  if(camera.position.y<=1.7){
   camera.position.y=1.7;
   jumping=false;
   vertical=0;
  }
 }

 recoil*=Math.pow(.08,dt);
 gun.position.z=recoil*.3;
 gun.position.y=-recoil*.4;

 // Target bergerak ringan
 targets.forEach((t,i)=>{
  if(t.userData.alive){
   t.position.y=1.8+Math.sin(now*.001+i)*.3;
  }
 });

 renderer.render(scene,camera);
}

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
