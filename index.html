
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON STRIKE MOBILE V2</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#080e1b;color:white;font-family:Arial;touch-action:none}
#game{position:fixed;inset:0}
#hud{position:fixed;top:12px;left:10px;right:10px;display:flex;justify-content:space-between;gap:5px;pointer-events:none}
.panel{background:#101d31dd;border:1px solid #27dafa88;border-radius:9px;padding:9px;font-size:12px}
#cross{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#56f5ff;font-size:25px;pointer-events:none}
#controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 18px}
#stick{width:105px;height:105px;border:2px solid #4eeaff88;border-radius:50%;background:#18324b99;position:relative;touch-action:none}
#knob{width:42px;height:42px;border-radius:50%;background:#4eeaffbb;position:absolute;left:30px;top:30px}
#fire{width:78px;height:78px;border:2px solid #ffb2bd;border-radius:50%;background:#ed4261;color:white;font-weight:bold}
#menu,#editor{position:fixed;inset:0;z-index:5;background:#080e1bf5;display:flex;align-items:center;justify-content:center;overflow:auto}
.box{width:90%;max-width:390px;background:#111f34;border:1px solid #35dafa66;border-radius:18px;padding:20px;text-align:center}
h1{color:#47eaff;letter-spacing:3px}
button{border:0;border-radius:9px;padding:12px;background:#25d3ed;color:#06121d;font-weight:bold}
input{width:100%;padding:12px;background:#071421;border:1px solid #34536b;color:white;border-radius:8px;margin:6px 0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#editor{display:none;flex-direction:column;padding:12px;gap:10px}
#drawCanvas{width:100%;height:55vh;max-height:500px;background:#080808;border:1px solid #48eaff;border-radius:12px;touch-action:none}
.tools{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}
.tools button{padding:10px}
#message{color:#82dfff;font-size:12px;min-height:18px}
#weaponLabel{position:fixed;bottom:130px;right:18px;color:#a7eaff;font-size:10px;pointer-events:none}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
 <div class="panel">SCORE: <b id="score">0</b></div>
 <div class="panel">ROOM: <b id="room">SOLO</b></div>
 <div class="panel">PLAYERS: <b id="players">1/8</b></div>
</div>
<div id="cross">+</div>
<div id="weaponLabel">CUSTOM BLASTER</div>

<div id="controls">
 <div id="stick"><div id="knob"></div></div>
 <button id="fire">TEMBAK</button>
</div>

<div id="menu">
 <div class="box">
  <h1>NEON STRIKE</h1>
  <p>DRAW YOUR WEAPON</p>
  <p style="font-size:12px;color:#a8bed0">MOBILE 3D FPS</p>
  <input id="name" maxlength="16" placeholder="Nama pemain">
  <button id="solo" style="width:100%;margin:7px 0">MAIN SENDIRI</button>
  <div class="actions">
   <button id="host">BUAT ROOM</button>
   <button id="join">GABUNG ROOM</button>
  </div>
  <input id="roomCode" placeholder="Kode room teman">
  <button id="openEditor" style="width:100%;margin-top:8px">GAMBAR SENJATA SENDIRI</button>
  <p id="message">Pilih mode permainan</p>
 </div>
</div>

<div id="editor">
 <h2 style="color:#49eaff;margin:5px">STUDIO SENJATA</h2>
 <p style="font-size:12px;color:#abc">Gambar bebas. Mulai dari titik mana saja!</p>
 <canvas id="drawCanvas"></canvas>
 <div class="tools">
  <button data-color="#ffffff">Putih</button>
  <button data-color="#ff4545">Merah</button>
  <button data-color="#35dfff">Biru</button>
  <button data-color="#48ed94">Hijau</button>
  <button id="erase">Penghapus</button>
  <button id="clear">Hapus semua</button>
 </div>
 <div class="tools">
  <button id="save">SIMPAN SENJATA</button>
  <button id="back" style="background:#34465c;color:white">KEMBALI</button>
 </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const $=id=>document.getElementById(id);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x091426);
scene.fog=new THREE.Fog(0x091426,20,55);

const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,100);
camera.position.set(0,1.7,5);

const renderer=new THREE.WebGLRenderer({
 antialias:false,powerPreference:'low-power'
});
renderer.setPixelRatio(Math.min(devicePixelRatio,1));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=false;
$('game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xb8ddff,0x293047,2));
const sun=new THREE.DirectionalLight(0xffffff,1);
sun.position.set(3,8,5);
scene.add(sun);

// Arena 3D
const floor=new THREE.Mesh(
 new THREE.PlaneGeometry(48,48),
 new THREE.MeshLambertMaterial({color:0x17283d})
);
floor.rotation.x=-Math.PI/2;
scene.add(floor);

const grid=new THREE.GridHelper(48,24,0x19bfe7,0x29425c);
grid.position.y=.02;
scene.add(grid);

function wall(x,y,z,sx,sy,sz){
 const obj=new THREE.Mesh(
  new THREE.BoxGeometry(sx,sy,sz),
  new THREE.MeshLambertMaterial({color:0x2b4058})
 );
 obj.position.set(x,y,z);
 scene.add(obj);
}
wall(0,2,-24,48,4,1);
wall(0,2,24,48,4,1);
wall(-24,2,0,1,4,48);
wall(24,2,0,1,4,48);

for(let i=0;i<14;i++){
 const h=1+Math.random()*1.3;
 const block=new THREE.Mesh(
  new THREE.BoxGeometry(2,h,2),
  new THREE.MeshLambertMaterial({color:0x263e58})
 );
 block.position.set((Math.random()-.5)*35,h/2,-Math.random()*22);
 scene.add(block);
}

// Target latihan
const targets=[];
function createTarget(x,z){
 const group=new THREE.Group();
 const body=new THREE.Mesh(
  new THREE.BoxGeometry(.8,1.2,.55),
  new THREE.MeshLambertMaterial({color:0xff426b})
 );
 body.position.y=.8;
 group.add(body);
 const head=new THREE.Mesh(
  new THREE.SphereGeometry(.28,8,6),
  new THREE.MeshLambertMaterial({color:0xffd36c})
 );
 head.position.y=1.55;
 group.add(head);
 group.position.set(x,0,z);
 scene.add(group);
 targets.push(group);
}
for(let i=0;i<8;i++){
 createTarget((Math.random()-.5)*18,-9-Math.random()*13);
}

// Senjata kapur
const weaponCanvas=document.createElement('canvas');
weaponCanvas.width=512;
weaponCanvas.height=320;
const wctx=weaponCanvas.getContext('2d');

function defaultWeapon(){
 wctx.clearRect(0,0,512,320);
 wctx.strokeStyle='#ffffff';
 wctx.lineWidth=11;
 wctx.lineCap='round';
 wctx.lineJoin='round';
 wctx.strokeRect(110,115,230,85);
 wctx.strokeRect(260,195,65,75);
 wctx.strokeRect(335,140,100,30);
 wctx.beginPath();
 wctx.moveTo(150,115);wctx.lineTo(185,75);
 wctx.lineTo(300,75);wctx.lineTo(340,115);
 wctx.stroke();
 wctx.beginPath();
 wctx.moveTo(140,155);wctx.lineTo(305,155);
 wctx.stroke();
}
defaultWeapon();

function loadWeapon(){
 const saved=localStorage.getItem('neonWeapon');
 if(saved){
  const img=new Image();
  img.onload=()=>{
   wctx.clearRect(0,0,512,320);
   wctx.drawImage(img,0,0,512,320);
   weaponTexture.needsUpdate=true;
  };
  img.src=saved;
 }
}

const weaponTexture=new THREE.CanvasTexture(weaponCanvas);
weaponTexture.colorSpace=THREE.SRGBColorSpace;
const weapon=new THREE.Mesh(
 new THREE.PlaneGeometry(1.15,.72),
 new THREE.MeshBasicMaterial({
  map:weaponTexture,transparent:true,
  depthTest:false,depthWrite:false
 })
);
weapon.position.set(.57,-.47,-1.15);
weapon.renderOrder=1000;
camera.add(weapon);
scene.add(camera);
loadWeapon();

// Editor gambar bebas
const canvas=$('drawCanvas');
const ctx=canvas.getContext('2d');
let color='#ffffff',eraser=false,drawing=false;
let canvasReady=false;

function resizeDraw(){
 const old=document.createElement('canvas');
 old.width=canvas.width||512;
 old.height=canvas.height||320;
 if(canvas.width)old.getContext('2d').drawImage(canvas,0,0);

 const w=canvas.clientWidth;
 const h=canvas.clientHeight;
 canvas.width=w*devicePixelRatio;
 canvas.height=h*devicePixelRatio;
 ctx.scale(devicePixelRatio,devicePixelRatio);
 ctx.lineCap='round';
 ctx.lineJoin='round';
 ctx.lineWidth=6;
 if(canvasReady){
  ctx.drawImage(old,0,0,old.width,old.height,0,0,w,h);
 }
 canvasReady=true;
}
function point(e){
 const r=canvas.getBoundingClientRect();
 return {x:e.clientX-r.left,y:e.clientY-r.top};
}
canvas.addEventListener('pointerdown',e=>{
 drawing=true;
 canvas.setPointerCapture(e.pointerId);
 const p=point(e);
 ctx.beginPath();
 ctx.moveTo(p.x,p.y);
});
canvas.addEventListener('pointermove',e=>{
 if(!drawing)return;
 const p=point(e);
 ctx.globalCompositeOperation=eraser?'destination-out':'source-over';
 ctx.strokeStyle=color;
 ctx.lineWidth=eraser?25:6;
 ctx.lineTo(p.x,p.y);
 ctx.stroke();
});
function stopDraw(){drawing=false;ctx.closePath();}
canvas.addEventListener('pointerup',stopDraw);
canvas.addEventListener('pointercancel',stopDraw);

$('openEditor').onclick=()=>{
 $('editor').style.display='flex';
 setTimeout(resizeDraw,30);
};
document.querySelectorAll('[data-color]').forEach(b=>{
 b.onclick=()=>{color=b.dataset.color;eraser=false};
});
$('erase').onclick=()=>eraser=true;
$('clear').onclick=()=>ctx.clearRect(0,0,canvas.width,canvas.height);

$('save').onclick=()=>{
 try{
  const temp=document.createElement('canvas');
  temp.width=512;temp.height=320;
  temp.getContext('2d').drawImage(canvas,0,0,512,320);
  const data=temp.toDataURL('image/png');
  localStorage.setItem('neonWeapon',data);
  wctx.clearRect(0,0,512,320);
  wctx.drawImage(temp,0,0);
  weaponTexture.needsUpdate=true;
  $('message').textContent='Desain senjata berhasil disimpan!';
 }catch(e){
  $('message').textContent='Penyimpanan gagal. Coba gambar lebih sederhana.';
 }
};
$('back').onclick=()=>$('editor').style.display='none';

// Kontrol joystick
let mx=0,my=0;
const stick=$('stick'),knob=$('knob');
let stickId=null;
stick.addEventListener('pointerdown',e=>{
 stickId=e.pointerId;
 stick.setPointerCapture(e.pointerId);
});
stick.addEventListener('pointermove',e=>{
 if(e.pointerId!==stickId)return;
 const r=stick.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);
 const len=Math.hypot(dx,dy);
 if(len>35){dx=dx/len*35;dy=dy/len*35;}
 mx=dx/35;my=dy/35;
 knob.style.left=(30+dx)+'px';
 knob.style.top=(30+dy)+'px';
});
function stopStick(){
 stickId=null;mx=0;my=0;
 knob.style.left='30px';knob.style.top='30px';
}
stick.addEventListener('pointerup',stopStick);
stick.addEventListener('pointercancel',stopStick);

// Kamera: geser bagian tengah/kanan layar
let yaw=0,pitch=0,lookId=null,lx=0,ly=0;
renderer.domElement.addEventListener('pointerdown',e=>{
 if(e.clientX<innerWidth*.35)return;
 lookId=e.pointerId;lx=e.clientX;ly=e.clientY;
 renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove',e=>{
 if(e.pointerId!==lookId)return;
 yaw-=(e.clientX-lx)*.005;
 pitch-=(e.clientY-ly)*.004;
 pitch=Math.max(-1,Math.min(1,pitch));
 lx=e.clientX;ly=e.clientY;
});
renderer.domElement.addEventListener('pointerup',()=>lookId=null);
renderer.domElement.addEventListener('pointercancel',()=>lookId=null);

// Menembak target latihan
const ray=new THREE.Raycaster();
let score=0,started=false;
function shoot(){
 if(!started)return;
 weapon.position.z=-.98;
 setTimeout(()=>weapon.position.z=-1.15,90);
 ray.setFromCamera(new THREE.Vector2(0,0),camera);
 const hits=ray.intersectObjects(targets,true);
 if(hits.length){
  const target=hits[0].object.parent;
  scene.remove(target);
  const i=targets.indexOf(target);
  if(i>=0)targets.splice(i,1);
  score++;
  $('score').textContent=score;
  if(targets.length===0){
   for(let i=0;i<8;i++)createTarget((Math.random()-.5)*18,-9-Math.random()*13);
  }
  send({type:'score',score});
 }
}
$('fire').addEventListener('pointerdown',e=>{
 e.preventDefault();shoot();
});

// Multiplayer prototype: room host dan join melalui PeerJS
let peer=null,connections=[],isHost=false,roomCode='';
let remote={};
let lastNetwork=0;
let playerName='Pemain';

function message(t){$('message').textContent=t;}
function send(data){
 connections.forEach(c=>{if(c.open)c.send(data)});
}
function updatePlayerCount(){
 $('players').textContent=(1+connections.filter(c=>c.open).length)+'/8';
}
function setupConnection(c){
 if(connections.length>=7){c.close();return;}
 connections.push(c);
 c.on('open',()=>{
  updatePlayerCount();
  message('Teman terhubung!');
  c.send({type:'hello',name:playerName});
 });
 c.on('data',data=>{
  if(data.type==='state'){
   remote[c.peer]=data;
   if(isHost)send({...data,type:'remote',peer:c.peer});
  }
  if(data.type==='remote')remote[data.peer]=data;
  if(data.type==='score'){
   score=data.score;
   $('score').textContent=score;
  }
  if(data.type==='hello'){
   message(data.name+' bergabung!');
  }
 });
 c.on('close',()=>{
  delete remote[c.peer];
  connections=connections.filter(x=>x!==c);
  updatePlayerCount();
 });
}

function createRoom(){
 if(!window.Peer){message('Layanan koneksi belum tersedia');return;}
 playerName=$('name').value.trim()||'Pemain';
 isHost=true;
 peer=new Peer();
 peer.on('open',id=>{
  roomCode=id;
  $('room').textContent=id.slice(0,9);
  message('Room siap! Bagikan kode: '+id);
  startGame();
 });
 peer.on('connection',c=>{
  if(connections.length<7)setupConnection(c);
  else c.close();
 });
 peer.on('error',e=>message('Koneksi gagal: '+e.type));
}
function joinRoom(){
 if(!window.Peer){message('Layanan koneksi belum tersedia');return;}
 const id=$('roomCode').value.trim();
 if(!id){message('Masukkan kode room teman');return;}
 playerName=$('name').value.trim()||'Pemain';
 isHost=false;
 peer=new Peer();
 peer.on('open',()=>{
  const c=peer.connect(id);
  setupConnection(c);
  c.on('open',()=>{
   roomCode=id;
   $('room').textContent=id.slice(0,9);
   startGame();
  });
 });
 peer.on('error',e=>message('Tidak bisa bergabung: '+e.type));
}
function startGame(){
 started=true;
 $('menu').style.display='none';
}
$('host').onclick=createRoom;
$('join').onclick=joinRoom;
$('solo').onclick=()=>{
 playerName=$('name').value.trim()||'Pemain';
 $('room').textContent='SOLO';
 startGame();
};

// Remote player display
function updateRemote(){
 for(const id in remote){
  const p=remote[id];
  if(!p.mesh){
   p.mesh=new THREE.Mesh(
    new THREE.BoxGeometry(.65,1.5,.55),
    new THREE.MeshLambertMaterial({color:0x30dfff})
   );
   scene.add(p.mesh);
  }
  p.mesh.position.set(p.x,.8,p.z);
 }
}

// Game loop
const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 if(started){
  camera.rotation.order='YXZ';
  camera.rotation.y=yaw;
  camera.rotation.x=pitch;

  const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  const movement=new THREE.Vector3();
  movement.addScaledVector(forward,-my);
  movement.addScaledVector(right,mx);

  if(movement.length()>0){
   movement.normalize().multiplyScalar(5*dt);
   camera.position.add(movement);
  }
  camera.position.x=THREE.MathUtils.clamp(camera.position.x,-22,22);
  camera.position.z=THREE.MathUtils.clamp(camera.position.z,-22,22);
  camera.position.y=1.7;

  updateRemote();

  if(peer&&connections.length&&performance.now()-lastNetwork>100){
   send({
    type:'state',
    x:camera.position.x,
    z:camera.position.z,
    yaw,
    name:playerName
   });
   lastNetwork=performance.now();
  }
 }
 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1));
});
</script>
</body>
</html>
